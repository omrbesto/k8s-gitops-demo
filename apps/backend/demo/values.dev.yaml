# Development environment for Demo Backend
app:
  name: demo-back-dev
  containerPort: 8888  # แก้ไข port ให้ตรงกับที่ใช้

image:
  repository: 192.168.56.103:8082/demo-spring-boot-app
  tag: "32"

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo-back-dev.local
      paths:
        - path: /
          pathType: Prefix

resources: {}
# Add Log
podAnnotations:
  # Enable Promtail scraping
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  # Add logging annotations
  logging.io/collect: "true"
  logging.io/format: "json"