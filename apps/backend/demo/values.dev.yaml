# Development environment for Demo Backend
app:
  name: demo-back-dev

image:
  repository: 192.168.56.103:8082/demo-spring-boot-app
  tag: "dev-latest"

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo-back-dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
# Logging annotations for Promtail/Loki
podAnnotations:
  logging.io/collect: "true"
  logging.io/format: "json"