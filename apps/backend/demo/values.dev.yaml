# Development environment for Demo Backend
app:
  name: demo-back-dev

image:
  repository: 192.168.56.103:8082/demo-spring-boot-app
  tag: "dev-latest"

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo-back-dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
# ADD THIS NEW SECTION
podAnnotations:
  # Enable Promtail to scrape logs from this pod
  # This label tells the Promtail scraping job to find this pod
  promtail.io/scrape: "true"

  # Path to the log file inside the container.
  # This is usually where log files are stored
  promtail.io/path: "/var/log/containers/*.log"

  # The job name for logs in Loki
  promtail.io/job: "demo-back-dev"

  # The Loki pipeline stage for log parsing
  promtail.io/pipeline-stages: |-
    - docker: {}