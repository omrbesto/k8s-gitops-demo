# Development environment for Demo Backend
app:
  name: demo-back-dev
  instance: demo-app
  version: "dev"
  managedBy: helm
  containerPort: 8888
  # Additional environment variables if needed
  env: []

image:
  # IP และชื่อ repository ต้องตรงกับใน Nexus
  repository: nexus.devops.test:31800/k8s-backend-demo
  tag: "8"
  pullSecrets:
    - name: nexus-pull-secret
  pullPolicy: IfNotPresent

replicaCount: 2

# Logging configuration
logging:
  level:
    root: "INFO"
    application: "DEBUG"
  # Additional logging annotations if needed
  annotations: {}

# Health check probes
probes:
  liveness:
    enabled: true
    path: /actuator/health  # ใช้ path ทั่วไปก่อน
    initialDelaySeconds: 60  # เพิ่มเวลาให้แอปเริ่มต้น
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readiness:
    enabled: true
    path: /actuator/health  # ใช้ path ทั่วไปก่อน
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  targetPort: 8888

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo-back-dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi