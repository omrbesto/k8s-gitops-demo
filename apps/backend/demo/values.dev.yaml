# Development environment for Demo Backend
app:
  name: demo-back-dev
  instance: demo-app
  version: "dev"
  managedBy: helm
  containerPort: 8888
  # Additional environment variables if needed
  env: []

image:
  repository: 192.168.56.103:8082/demo-spring-boot-app
  tag: "32"
  pullPolicy: IfNotPresent

replicaCount: 1

# Logging configuration
logging:
  level:
    root: "INFO"
    application: "DEBUG"
  # Additional logging annotations if needed
  annotations: {}

# Health check probes
probes:
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  targetPort: 8888

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo-back-dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi